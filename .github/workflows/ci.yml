name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Eval gate (mock model, no key)
        id: gate
        uses: ./action
        with:
          config: examples/evalboard.config.json
          out_dir: evalboard-report
      - name: A regressed config must fail the gate
        id: regressed
        uses: ./action
        continue-on-error: true
        with:
          config: examples/regressed.config.json
          out_dir: evalboard-report-regressed
      - name: Check the regressed run was caught
        run: |
          test "${{ steps.gate.outputs.passed }}" = "true"
          test "${{ steps.regressed.outcome }}" = "failure"
          test "${{ steps.regressed.outputs.passed }}" = "false"
          grep -q "dropped" evalboard-report-regressed/report.md
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evalboard-report
          path: |
            evalboard-report
            evalboard-report-regressed

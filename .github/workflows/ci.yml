name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Eval gate (mock model, no key)
        id: gate
        uses: ./action
        with:
          config: examples/evalboard.config.json
          out_dir: evalboard-report
      - name: A regressed config is reported as failed (fail_on_gate false, so this step stays green)
        id: regressed
        uses: ./action
        with:
          config: examples/regressed.config.json
          out_dir: evalboard-report-regressed
          fail_on_gate: 'false'
      - name: Check the regressed run was caught and the CLI exits 1
        run: |
          test "${{ steps.gate.outputs.passed }}" = "true"
          test "${{ steps.regressed.outputs.passed }}" = "false"
          grep -q "dropped" evalboard-report-regressed/report.md
          set +e; node cli/evalboard.js examples/regressed.config.json --quiet --out /tmp/regressed > /dev/null; code=$?; set -e
          test "$code" = "1"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evalboard-report
          path: |
            evalboard-report
            evalboard-report-regressed
